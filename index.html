    <style>
        :root {
            --bg: #f7f8fa;
            --surface: rgba(255, 255, 255, 0.72);
            --surface-strong: rgba(255, 255, 255, 0.92);
            --border: rgba(107, 114, 121, 0.35);
            --text: #212529;
            --muted: #6c757d;
            --accent: #2d6fff;
            --accent-soft: rgba(45, 111, 255, 0.10);
            --shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        [data-bs-theme="dark"] {
            --bg: #151719;
            --surface: rgba(25, 28, 31, 0.76);
            --surface-strong: rgba(29, 32, 35, 0.94);
            --border: rgba(107, 114, 121, 0.6);
            --text: #f8f9fa;
            --muted: #adb5bd;
            --accent: #5f8fff;
            --accent-soft: rgba(95, 143, 255, 0.14);
            --shadow: 0 10px 35px rgba(0, 0, 0, 0.32);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            font-family: "Roboto", system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left,
                    rgba(45, 111, 255, 0.14),

                    rgba(77, 172, 0, 0.10),

        .veil {

<body>

    <div class="veil"></div>

    <div class="container">

        <header>
            <div class="header-bar">
                <div class="header-title">
                    Relative Time Statistics
                </div>

                <div class="header-domain">
                    clock.alphabeti.co.tz
                </div>
            </div>

            <div class="hero">
                <h1>Time Progress</h1>
                <p>Live relative statistics for the current period.</p>
            </div>
        </header>

        <main>

            <div id="clock">
                YYYY, Month DD:HH:MM:SS
            </div>

            <div class="tabs-wrapper">
                <div class="tabs">
                    <div class="tab active" data-tab="year">Year</div>
                    <div class="tab" data-tab="month">Month</div>
                    <div class="tab" data-tab="week">Week</div>
                    <div class="tab" data-tab="day">Day</div>
                    <div class="tab" data-tab="hour">Hour</div>
                    <div class="tab" data-tab="minute">Minute</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header" id="cardTitle">
                    Year Progress
                </div>

                <div class="card-body">
                    <div class="stats" id="tabContent"></div>
                </div>
            </div>

        </main>

        <footer>
            clock.alphabeti.co.tz
        </footer>

    </div>

    <script>
        function updateClock() {
            const now = new Date();

            const year = now.getFullYear();
            const month = now.toLocaleString('default', {
                month: 'long'
            });

            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('clock').textContent =
                `${year}, ${month} ${day} ${hours}:${minutes}:${seconds}`;
        }

        setInterval(updateClock, 1000);
        updateClock();

        const tabs = document.querySelectorAll('.tab');
        const tabContent = document.getElementById('tabContent');
        const cardTitle = document.getElementById('cardTitle');

        function calculateRelativeStats() {
            const now = new Date();

            const startOfYear =
                new Date(now.getFullYear(), 0, 1);

            const diffYearMs = now - startOfYear;

            const yearMonths = now.getMonth() + 1;

            const yearWeeks =
                Math.floor(
                    diffYearMs /
                    (1000 * 60 * 60 * 24 * 7)
                );

            const yearDays =
                Math.floor(
                    diffYearMs /
                    (1000 * 60 * 60 * 24)
                ) + 1;

            const yearHours =
                Math.floor(
                    diffYearMs /
                    (1000 * 60 * 60)
                );

            const yearMinutes =
                Math.floor(
                    diffYearMs /
                    (1000 * 60)
                );

            const yearSeconds =
                Math.floor(
                    diffYearMs /
                    1000
                );


            const startOfMonth =
                new Date(
                    now.getFullYear(),
                    now.getMonth(),
                    1
                );

            const diffMonthMs =
                now - startOfMonth;

            const monthWeeks =
                Math.floor(
                    diffMonthMs /
                    (1000 * 60 * 60 * 24 * 7)
                );

            const monthDays =
                Math.floor(
                    diffMonthMs /
                    (1000 * 60 * 60 * 24)
                ) + 1;

            const monthHours =
                Math.floor(
                    diffMonthMs /
                    (1000 * 60 * 60)
                );

            const monthMinutes =
                Math.floor(
                    diffMonthMs /
                    (1000 * 60)
                );

            const monthSeconds =
                Math.floor(
                    diffMonthMs /
                    1000
                );


            const startOfWeek = new Date(now);

            startOfWeek.setHours(0, 0, 0, 0);

            startOfWeek.setDate(
                now.getDate() - now.getDay()
            );

            const diffWeekMs =
                now - startOfWeek;

            const weekDays =
                Math.floor(
                    diffWeekMs /
                    (1000 * 60 * 60 * 24)
                ) + 1;

            const weekHours =
                Math.floor(
                    diffWeekMs /
                    (1000 * 60 * 60)
                );

            const weekMinutes =
                Math.floor(
                    diffWeekMs /
                    (1000 * 60)
                );

            const weekSeconds =
                Math.floor(
                    diffWeekMs /
                    1000
                );


            const startOfDay =
                new Date(now);

            startOfDay.setHours(
                0,
                0,
                0,
                0
            );

            const diffDayMs =
                now - startOfDay;

            const dayHours =
                Math.floor(
                    diffDayMs /
                    (1000 * 60 * 60)
                );

            const dayMinutes =
                Math.floor(
                    diffDayMs /
                    (1000 * 60)
                );

            const daySeconds =
                Math.floor(
                    diffDayMs /
                    1000
                );


            const startOfHour =
                new Date(now);

            startOfHour.setMinutes(
                0,
                0,
                0
            );

            const diffHourMs =
                now - startOfHour;

            const hourMinutes =
                Math.floor(
                    diffHourMs /
                    (1000 * 60)
                );

            const hourSeconds =
                Math.floor(
                    diffHourMs /
                    1000
                );


            const startOfMinute =
                new Date(now);

            startOfMinute.setSeconds(
                0,
                0
            );

            const diffMinuteMs =
                now - startOfMinute;

            const minuteSeconds =
                Math.floor(
                    diffMinuteMs /
                    1000
                );


            return {
                year: {
                    Months: yearMonths,
                    Weeks: yearWeeks,
                    Days: yearDays,
                    Hours: yearHours,
                    Minutes: yearMinutes,
                    Seconds: yearSeconds
                },

                month: {
                    Weeks: monthWeeks,
                    Days: monthDays,
                    Hours: monthHours,
                    Minutes: monthMinutes,
                    Seconds: monthSeconds
                },

                week: {
                    Days: weekDays,
                    Hours: weekHours,
                    Minutes: weekMinutes,
                    Seconds: weekSeconds
                },

                day: {
                    Hours: dayHours,
                    Minutes: dayMinutes,
                    Seconds: daySeconds
                },

                hour: {
                    Minutes: hourMinutes,
                    Seconds: hourSeconds
                },

                minute: {
                    Seconds: minuteSeconds
                }
            };
        }

        function updateTab() {
            const stats =
                calculateRelativeStats();

            const activeTab =
                document.querySelector(
                    '.tab.active'
                ).dataset.tab;

            cardTitle.textContent =
                activeTab.charAt(0).toUpperCase() +
                activeTab.slice(1) +
                ' Progress';

            const values =
                stats[activeTab];

            tabContent.innerHTML =
                Object.entries(values)
                    .map(([label, value]) => `
                        <div class="stat">
                            <span class="stat-label">
                                ${label}
                            </span>

                            <div class="stat-value">
                                ${value.toLocaleString()}
                            </div>
                        </div>
                    `)
                    .join('');
        }

        tabs.forEach(tab => {
            tab.addEventListener(
                'click',
                () => {
                    tabs.forEach(
                        item =>
                            item.classList.remove(
                                'active'
                            )
                    );

                    tab.classList.add(
                        'active'
                    );

                    updateTab();
                }
            );
        });

        setInterval(
            updateTab,
            1000
        );

        updateTab();
    </script>

</body>

</html>
